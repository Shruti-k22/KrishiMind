name: krishimind
description: "KrishiMind — AI farming advisor for Maharashtra farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Saves the farmer's language and district on the phone, so the app only
  # ever asks once. Cleared only when the app is uninstalled.
  shared_preferences: ^2.3.3

  # Fetches the weather from Open-Meteo. No API key, no account, free.
  http: ^1.2.2

  # Firebase — real user accounts. firebase_core connects the app to the
  # project; firebase_auth handles sign up, sign in and passwords. Passwords are
  # stored encrypted by Google and never touch our code.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Our brand artwork. Everything inside this folder is bundled into the app.
  assets:
    - assets/branding/

  # Devanagari font, bundled so Marathi and Hindi text renders correctly
  # even with no internet. Noto Sans Devanagari is under the SIL Open Font
  # License, which allows use in apps.
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari-Regular.ttf
        - asset: fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
